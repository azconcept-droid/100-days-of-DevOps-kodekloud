apiVersion: v1
kind: Pod
metadata:
  name: pod-xfusion
  labels:
    app: xfusion-app
spec:
  containers:
    - name: container-xfusion
      image: httpd:latest
      volumeMounts:
        - mountPath: /usr/local/apache2/htdocs
          name: web-storage
  volumes:
    - name: web-storage
      persistentVolumeClaim:
        claimName: pvc-xfusion
